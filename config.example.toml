# Configuración de Genix. Copie este archivo a config.toml y complete los valores.
# config.toml está en .gitignore: nunca se versiona.

app_name       = "genix"
is_local       = true
environment    = ""
admin_email    = "admin@example.com"
admin_password = "admin_password"
# secret_phrase firma lo que sostiene el usuario: tokens de sesión y hashes de contraseña.
secret_phrase  = "cambie_esta_frase"
# internal_apikey autentica proceso-a-proceso: las tramas TCP del rate limiter y la cabecera
# X-Bridge-Auth del SSE bridge (ambos en server_utils/). Separado de secret_phrase para poder
# rotarlo sin invalidar todas las sesiones activas.
internal_apikey = "cambie_esta_clave"
github_account = "mi-cuenta"

# Puerto TCP crudo del proceso genix-server-utils. Sección propia y no una clave de [rate_limit]
# porque no es de un servicio: el opcode de la trama decide si atiende el credit limiter o el
# lock service, y los dos escuchan aquí.
#
# host es la dirección que MARCA el cliente (el backend); public es lo que BINDEA el daemon:
# true = 0.0.0.0, false = 127.0.0.1. Son campos distintos porque detrás de un NAT no pueden ser
# el mismo valor: la IP pública de una VM en la nube nunca está en su interfaz, y bindearla falla
# con EADDRNOTAVAIL. Con public = false el cliente ignora host y usa loopback.
#
# public = true expone el puerto a Internet: las tramas van autenticadas con HMAC pero SIN cifrar,
# así que sólo tiene sentido cuando el backend corre fuera del servidor (p. ej. en Lambda).
[server_utils]
host = "127.0.0.1"
port = 14013
public = false

# ─── Qdrant (base de datos vectorial) ───────────────────────────────────────
# Lo instala 'configure_db.py qdrant'. host vacío = lo escribe el script con la IP
# alcanzable del host. public decide el bind: 0.0.0.0 y puertos abiertos en el firewall,
# o sólo loopback. La api key que exige Qdrant en la cabecera 'api-key' es
# internal_apikey: no hay una credencial aparte.
[qdrant]
host      = ""
http_port = 14014
grpc_port = 14015
public    = true
use_tls   = false
collection = "genix_user_documentation_v1"

# Dense retrieval is independent from providers.model (the chat provider).
# Keep the model ID explicit: silently changing it would mix incompatible vectors.
[embedding_model]
provider   = "openrouter"
id         = "qwen/qwen3-embedding-8b"
dimensions = 4096

# ─── Proveedores ────────────────────────────────────────────────────────────
[providers]
backend = "none"        # aws | cloudflare | none  — espejo de datos: DynamoDB, D1 o ninguno
cdn     = "aws"         # aws | cloudflare         — object storage y origen público de assets
model   = "openrouter"  # meta | openrouter        — LLM del agente; sólo se exige su key

# ─── Base de datos (ScyllaDB / Cassandra) ───────────────────────────────────
[db]
host        = "111.111.111.111"
port        = 9042
name        = "genix"
user        = "cassandra"
password    = "my_strong_password"
disable_ssl = false
# max_clustering_key_restrictions_per_query del nodo. 0 usa el default del ORM (100).
max_clustering_key = 100

# ─── Servidor propio (systemd + Nginx) ──────────────────────────────────────
[server]
# port debe coincidir con la mitad de puerto de nginx_process. 0 usa 3589.
port          = 14010
nginx_domain  = "api.example.com"
nginx_process = "127.0.0.1:14010"

# ─── Credit rate limiter (server_utils/) ───────────────────────────────────
# Una de las dos mitades del proceso genix-server-utils; la otra es [sse_bridge].
# Se autentica con internal_apikey (raíz), no con secret_phrase.
[rate_limit]
flush_seconds         = 15
frame_timeout_seconds = 30
max_connections       = 1024
shards                = 0      # 0 = logical CPU count
# Peticiones simultáneas que una sola conexión puede tener en vuelo. Con una petición
# por socket el propio socket era el techo; al multiplexar ese freno desaparece, así que
# hay que declararlo: sin él un cliente autenticado podría lanzar tareas y encolar
# respuestas sin límite. Al superarlo se responde "no disponible", no se encola.
max_inflight_per_connection = 64

# Whole-company limits. CPU and inference credits are independent.
company_cpu_10s        = 2000
company_inference_10s  = 1000
company_cpu_1h         = 40000
company_inference_1h   = 10000
company_cpu_24h        = 200000
company_inference_24h  = 20000

# Per-user limits inside each company.
user_cpu_10s           = 1000
user_inference_10s     = 500
user_cpu_1h            = 20000
user_inference_1h      = 5000
user_cpu_24h           = 100000
user_inference_24h     = 10000

# ─── Lock service (server_utils/) ──────────────────────────────────────────
# Mismo proceso y mismo puerto que [rate_limit]; el opcode del frame decide el
# servicio. Aquí sólo hay techos de proceso: qué acción bloquea qué, y con qué
# cola y arrendamiento, lo deciden los call sites de Go. Eso es lo que mantiene
# el servicio genérico — la clave es (action:u16, identifier:i64) y el demonio
# no interpreta ninguno de los dos.
[lock]
max_keys          = 100000   # claves vivas antes de responder "capacidad"
max_total_waiters = 4096     # esperas encoladas en total
max_lease_ms      = 60000    # techo aplicado al arrendamiento que pide el cliente

# ─── Registro público de empresas ──────────────────────────────────────────
# Estos endpoints no llevan token, así que nunca pasan por el credit limiter:
# este es su único freno de plataforma. Se cuentan direcciones DISTINTAS, de
# modo que reintentar el mismo correo no consume presupuesto.
[sign_up]
max_emails_per_ip = 5    # por IPv4, o por prefijo /63 en IPv6
window_minutes    = 20

# ─── AWS ────────────────────────────────────────────────────────────────────
[aws]
region            = "us-east-1"
profile           = "default"
deployment_bucket = "deploys-bucket"
lambda_iam_role   = "arn:aws:iam::000000000000:role/lambda-role"
lambda_url        = ""
s3_bucket         = ""
frontend_bucket   = ""   # vacío = "<app_name>-frontend"

# ─── Cloudflare ─────────────────────────────────────────────────────────────
[cloudflare]
account     = ""
token       = ""
bucket      = ""   # vacío = "<app_name>-files"
database_id = ""

# ─── Frontend / CDN público ─────────────────────────────────────────────────
[frontend]
cdn_url   = ""
zone_name = ""
# Artefacto webpage-renderer.zip publicado por CI. Vacío = el default de
# core.DefaultWebpageRendererURL, que debe seguir igual al de cloud/webpage-renderer.go.
webpage_renderer_url = ""

# ─── SMTP ───────────────────────────────────────────────────────────────────
[smtp]
host     = "email-smtp.us-east-1.amazonaws.com"
port     = 587
email    = ""
user     = ""
password = ""

# ─── Agente / LLM ───────────────────────────────────────────────────────────
[agent]
# default_model debe existir en el proveedor elegido en providers.model.
# Vacío = el primer [[models]] (al final del archivo) que sirva ese proveedor.
default_model  = ""
meta_key       = ""
openrouter_key = ""

# ─── GenixSearch ────────────────────────────────────────────────────────────
# Los escribe 'configure_db.py search' con la IP alcanzable del host.
# url admite "host:puerto" o "esquema://host:puerto" (el esquema se ignora).
# Vacío = 127.0.0.1:14446.
[search]
url      = ""
password = ""

# ─── SSE Bridge (server_utils/) ─────────────────────────────────────────────
# Relay que sostiene el stream del agente cuando el backend corre en Lambda, que no
# puede mantener una conexión abierta. url igual a aws.lambda_url (o vacía) = sin
# bridge: el backend sirve su propio /agent/stream.
#
# Corre dentro del mismo proceso que [rate_limit]. No lleva apikey propia: usa
# internal_apikey (raíz) para las llamadas del backend y secret_phrase para verificar
# el token de sesión del navegador.
[sse_bridge]
url     = ""
port    = 14012
verbose = false   # true = loguea cada mensaje entregado

# ─── Logs ───────────────────────────────────────────────────────────────────
[logs]
full      = false
debug     = false
only_save = false

# ════════════════════════════════════════════════════════════════════════════
# TABLAS DE ARRAY — SIEMPRE AL FINAL DEL ARCHIVO.
# En TOML, tras un [[header]] toda clave suelta pertenece a esa tabla: añadir
# cualquier clave simple debajo de este punto la asigna al último [[...]].
# ════════════════════════════════════════════════════════════════════════════

# Endpoints ofrecidos en el selector de servidor del login.
[[endpoints]]
name    = "Principal"
route   = "https://mi-backend.example.com/"
# Vacío/omitido = este backend sirve /agent/stream; otro dominio = server_utils bridge.
bridge  = "https://mi-bridge.example.com/"
cdn_url = "https://mi-cdn.example.com/"

# Destinos del deploy a VPS (scripts/deploy_vps.go).
[[servers]]
host = "127.0.0.1"
user = "ubuntu"
bin  = "/usr/local/bin/genix/genix_app"
arch = "arm64"

# Modelos que puede usar el agente. El backend sólo ofrece los del proveedor activo
# (providers.model), así que el selector nunca muestra un id que la key rechazaría.
# El orden es el del selector y decide el default cuando agent.default_model está vacío.
#   provider  — "meta" | "openrouter"; vacío = openrouter.
#   reasoning — omitir el bloque en un modelo que no razona: enviarlo es un parámetro
#               desconocido para el upstream. En Meta sólo sobrevive effort.
#   routing   — sólo OpenRouter. sort = "throughput" elige el endpoint más rápido de la
#               lista del modelo; order + allow_fallbacks = false lo fijan a uno concreto.
[[models]]
id        = "muse-spark-1.2-contributor"
provider  = "meta"
reasoning = { effort = "medium" }

[[models]]
id        = "poolside/laguna-s-2.1"
provider  = "openrouter"
reasoning = { effort = "medium", exclude = true }
routing   = { sort = "throughput" }

[[models]]
id        = "deepseek/deepseek-v4-flash-0731"
provider  = "openrouter"
reasoning = { effort = "low", exclude = true }
routing   = { sort = "throughput" }
