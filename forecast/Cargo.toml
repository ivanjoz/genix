[package]
name = "genix-forecast"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Sales forecasting engine (damped Holt-Winters + TSB) compiled to WASM for the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
