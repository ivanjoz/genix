# Catálogo de accesos del sistema. Es la única fuente de verdad: el backend lo embebe
# (main-handlers.go) para autorizar cada ruta POST/PUT y el frontend lo importa como texto
# (access-list-catalog.ts) para decidir qué páginas y qué opciones de menú se muestran.
#
# REGLAS
#   - Los `id` son permanentes: quedan persistidos en `profiles.accesos` como (id*10 + nivel).
#     Nunca se renumeran ni se reutilizan; los accesos que se retiran se eliminan y su id se jubila.
#   - `frontend_routes`: rutas separadas por comas y SIN "/" inicial. El match es por prefijo de
#     segmentos y gana el más largo, así que "webpage-builder" cubre también
#     "/webpage-builder/<pageID>".
#   - `backend_apis`: lista separada por comas de "<MÉTODO>.<ruta>". TODA ruta POST/PUT no pública
#     debe aparecer aquí, porque el backend niega por defecto lo que no está mapeado. Los GET son
#     al revés: sin mapear quedan libres para cualquier sesión, y mapearlos es lo que los cierra
#     —así se restringe lectura por lectura—. Una misma ruta puede figurar en varios accesos:
#     basta con tener uno de ellos.
#     Excepciones deliberadas: las rutas "p-" (públicas) y las de `selfServiceRoutes` en
#     main-handlers.go (el usuario opera sobre sí mismo).
#   - `levels`: dígitos concatenados de los niveles ofrecidos. 14 = 1 (VER) + 4 (TODO).
access_groups:
  - id: 1
    name: "Configuración"
  - id: 2
    name: "Negocio"
  - id: 3
    name: "Comercial"
  - id: 4
    name: "Logística"
  - id: 5
    name: "Finanzas"
  - id: 6
    name: "Tienda"
  - id: 7
    name: "Contabilidad"
  - id: 8
    name: "System"
access_list:
