# RRHH. Salary data is split from people data by ROUTE, not by sub-access: the delta and by-IDs
# caches ship whole records, so a sub-access cannot hide a field a route already sent. Every route
# that carries money (contracts, payslips, advances...) belongs to "Planilla".

