# Module organization: how the pages of db/pages.toml are arranged into the modules of the module
# selector and the menu groups of the side menu. Modules are virtual: they do not follow the route
# folders, and one page may be listed in several modules for convenience.
#
# RULES
#   - `code`: permanent identifier, remembered in the browser (last module, last page per module).
#   - `name`: "English|Spanish". `icon`: Iconify class shown on the module selector.
#   - `saas_only = true`: only the company that runs the SaaS sees the module, and its pages are
#     blocked for every other company even through a typed URL. The backend repeats the restriction.
#   - `[[modules.menus]]` belongs to the closest `[[modules]]` above it: order in the file is what
#     links them, not indentation.
#   - `routes`: comma-separated, NO leading "/", each one declared in db/pages.toml. Menu order is
#     the order written here.
#   - A module shows up only for users who can open at least one of its pages (backend/access.toml).
#
# FORMAT: single-line values only. No indentation. Modules are listed in selector order.

[[modules]]
code = "commercial"
name = "Commercial|Comercial"
icon = "icon-[fa--shopping-cart]"

[[modules.menus]]
name = "Sales|Ventas"
min_name = "VEN"
routes = "sales/sale_order_create, sales/sale_orders_status, sales/sale_planning, sales/shipping-costs"

