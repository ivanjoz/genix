name: Build and release Linux binaries

# Version tags publish; manual main runs validate the backend and warm its cache.
# auth-limiter builds and publishes its own binaries from github.com/ivanjoz/auth-limiter.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A release tag must have only one publisher, and a running release must finish atomically.
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    name: Backend (linux/amd64 + linux/arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize backend ORM submodule
        # The backend only needs genix-orm; skipping the frontend submodule keeps checkout small.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # Releases must build the exact submodule commit recorded by the immutable tag.
            git submodule update --init --depth 1 backend/genix-orm
          else
            # Main validation follows the configured branch tip, matching the frontend workflow.
            git submodule update --init --remote --depth 1 backend/genix-orm
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # setup-go reads the exact toolchain directive instead of following a moving version.
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/genix-orm/go.sum
            backend/genix-orm/db/go.sum

      - name: Test backend
        working-directory: backend
        env:
          # A disabled Cgo toolchain is also the contract used by both static release builds.
          CGO_ENABLED: '0'
        run: go test ./...

      - name: Build static backend binaries
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          # Required on every shipping build, not optional size tuning: lambda.norpc drops net/rpc
          # and grpcnotrace drops x/net/trace with html/template. Each calls
          # reflect.Value.MethodByName with a runtime string, which sets the linker's global
          # reflectSeen flag and retains every exported method of every reachable type. The flag is
          # boolean, so omitting either tag costs ~12 MB even with backend/thirdparty/ in place.
          # cloud/main.go and scripts/deploy_vps.go carry the same list; a test keeps them in sync.
          BACKEND_BUILD_TAGS: lambda.norpc,grpcnotrace
        run: |
          # Tag and commit identify a release reproducibly without embedding the runner clock.
          release_identity="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          mkdir -p ../dist

          for target_architecture in amd64 arm64; do
            echo "Building backend for linux/${target_architecture} (${release_identity})"
            GOOS=linux GOARCH="$target_architecture" \
              go build -trimpath -tags "$BACKEND_BUILD_TAGS" \
              -ldflags="-s -w -X app/core.BuildDate=${release_identity}" \
              -o "../dist/genix_app_linux_${target_architecture}" .
          done

      - name: Verify backend ELF files
        run: |
          # Reject architecture mixups and any accidental dependency on a dynamic loader.
          for target_architecture in amd64 arm64; do
            binary_path="dist/genix_app_linux_${target_architecture}"
            case "$target_architecture" in
              amd64) expected_machine='x86-64' ;;
              arm64) expected_machine='ARM aarch64' ;;
            esac

            binary_description="$(file -b "$binary_path")"
            echo "${binary_path}: ${binary_description}"
            if [[ "$binary_description" != *"$expected_machine"* ]]; then
              echo "Expected machine ${expected_machine}" >&2
              exit 1
            fi
            if readelf -l "$binary_path" | grep -q 'Requesting program interpreter'; then
              echo "${binary_path} unexpectedly requires a dynamic loader" >&2
              exit 1
            fi
          done

      - name: Stage backend binaries for the publisher
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-binaries
          path: dist/genix_app_linux_*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build-backend
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download staged binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify release bundle and create checksums
        run: |
          # Require the complete bundle before generating a manifest or contacting Releases.
          expected_asset_names=(
            genix_app_linux_amd64
            genix_app_linux_arm64
          )

          found_asset_count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [[ "$found_asset_count" -ne "${#expected_asset_names[@]}" ]]; then
            echo "Expected ${#expected_asset_names[@]} binaries, found ${found_asset_count}" >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          for asset_name in "${expected_asset_names[@]}"; do
            asset_path="dist/${asset_name}"
            if [[ ! -s "$asset_path" ]]; then
              echo "Missing or empty release asset: ${asset_path}" >&2
              exit 1
            fi
            chmod 0755 "$asset_path"
            file "$asset_path"
            if readelf -l "$asset_path" | grep -q 'Requesting program interpreter'; then
              echo "${asset_path} unexpectedly requires a dynamic loader" >&2
              exit 1
            fi
          done

          # Bare filenames let sha256sum verify files downloaded into any directory.
          (
            cd dist
            sha256sum "${expected_asset_names[@]}" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh creates a draft, uploads the validated bundle, then publishes it as one release.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Genix ${GITHUB_REF_NAME}"
