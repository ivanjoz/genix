[package]
name = "genix-server-utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
getrandom = "0.4"
hmac = "0.12"
# Only for statvfs, which is how the disk column is read: nothing under /proc reports free space.
libc = "0.2"
scylla = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# ServiceExt::oneshot drives the axum router in tests without binding a real socket.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
