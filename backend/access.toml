# System access catalog. Single source of truth: the backend embeds it (main-handlers.go) to
# authorize every POST/PUT route, and the frontend imports it as text (access-list-catalog.ts) to
# decide which pages and menu options are shown.
#
# RULES
#   - `id`s are permanent: they are persisted in `profiles.accesos` as (id*10 + nivel). They are
#     never renumbered and never reused; a retired access is deleted and its id is retired with it.
#   - `frontend_routes`: comma-separated, NO leading "/". Matching is by segment prefix and the
#     longest one wins, so "webpage-builder" also covers "/webpage-builder/<pageID>".
#   - `backend_apis`: comma-separated "<METHOD>.<route>". EVERY non-public POST/PUT route must
#     appear here, because the backend denies by default whatever is not mapped. GETs work the
#     other way round: unmapped they are open to any session, and mapping one is what closes it,
#     so reads are restricted one at a time. A route may appear under several accesses: holding
#     any one of them is enough.
#     Deliberate exceptions: the "p-" (public) routes and the `selfServiceRoutes` of
#     main-handlers.go, where the user operates on itself.
#   - `levels`: concatenated digits of the offered levels. 14 = 1 (VER) + 4 (TODO).
#   - `sub_accesses_ids` / `sub_accesses_names`: parallel arrays of the same length. Sub-accesses
#     are flags, not levels: they qualify what a holder may do inside an access they already have.
#     Ids are permanent and run 2..13, exactly like access ids — never renumbered, never reused.
#     Id 1 is reserved for "Todos" and is never declared here: it is offered as a synthetic option
#     and, when granted, satisfies every sub-access check on that access.
#
# FORMAT: single-line values only. Arrays must fit on one line and carry no trailing comma.

