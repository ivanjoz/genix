# Page catalog: every page the side menu can list, defined once. db/modules.toml arranges these
# pages into modules by route; a page listed in several modules is still declared here only once.
#
# RULES
#   - `route`: the page's URL path, NO leading "/". It is the key modules.toml refers to.
#   - `name`: "English|Spanish", like every other UI text.
#   - `icon`: an Iconify class. Optional.
#   - `description`: what the page is for, in one sentence. Optional.
#   - `pending = true`: the page is planned but not built yet. The menu shows it disabled and it
#     never counts as a module's entry page.
#   - Access is not declared here: backend/access.toml decides who can open each route.
#
# FORMAT: single-line values only. No indentation.

